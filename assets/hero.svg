<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Roebin Uys · roebssie</title>
  <desc id="desc">Final-year Bachelor of Computing student at Belgium Campus. Hardware, software and databases. A subtle animated circuit and star illustrate the connection between hardware and code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111c2b"/><stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b2f5d7"/><stop offset="1" stop-color="#bcafff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9daec8" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="panel"><rect width="1200" height="400" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .signal { stroke-dasharray: 5 13; animation: travel 14s linear infinite; }
      .orbit { transform-origin: 982px 201px; animation: orbit 36s linear infinite; }
      .star { transform-origin: 1115px 61px; animation: breathe 6s ease-in-out infinite; }
      .cursor { animation: blink 1.8s steps(2,end) infinite; }
      @keyframes travel { to { stroke-dashoffset: -180; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity:.7; } 50% { transform: scale(1.15); opacity:1; } }
      @keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:.15; } }
      @media (prefers-reduced-motion: reduce) { .signal,.orbit,.star,.cursor { animation:none; } }
    </style>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect x="720" width="480" height="400" fill="url(#grid)"/>
    <circle cx="1055" cy="396" r="250" fill="#baacff" opacity=".035"/>
    <circle cx="1180" cy="30" r="220" fill="#a4f4d1" opacity=".025"/>
    <rect x=".5" y=".5" width="1199" height="399" rx="24" fill="none" stroke="#314155"/>
    <text x="52" y="56" font-size="15" fill="#b2f5d7" class="mono" letter-spacing="2.5">ROEBSSIE / HELLO, WORLD</text>
    <text x="48" y="151" font-size="76" font-weight="700" fill="#f4f7fc" letter-spacing="-3">Roebin Uys<tspan fill="#b2f5d7">.</tspan></text>
    <text x="52" y="205" font-size="29" font-weight="500" fill="#bac8dc">Curiosity into code.</text>
    <text x="52" y="260" font-size="20" fill="#9baec9">Final-year Bachelor of Computing</text>
    <text x="52" y="290" font-size="20" fill="#9baec9">Belgium Campus</text>
    <rect x="52" y="328" width="369" height="35" rx="17.5" fill="#b2f5d7" fill-opacity=".09" stroke="#b2f5d7" stroke-opacity=".24"/>
    <circle cx="72" cy="345.5" r="4" fill="#b2f5d7"/>
    <text x="88" y="351" font-size="15" fill="#d4f7e8" class="mono">HARDWARE · SOFTWARE · DATABASES</text>
    <g fill="none" stroke="#60758f" stroke-opacity=".5" stroke-width="1.5">
      <path d="M802 88H854L908 142M1060 250L1110 300H1200M770 317H830L894 253M1046 144L1108 82H1200"/>
      <circle cx="802" cy="88" r="4"/><circle cx="770" cy="317" r="4"/>
    </g>
    <path class="signal" d="M802 88H854L908 142M1060 250L1110 300H1200M770 317H830L894 253M1046 144L1108 82H1200" fill="none" stroke="#b2f5d7" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="982" cy="201" r="136" fill="none" stroke="#aabcf0" stroke-opacity=".14"/>
    <circle cx="982" cy="201" r="110" fill="none" stroke="#aabcf0" stroke-opacity=".11" stroke-dasharray="2 10"/>
    <g class="orbit">
      <circle cx="982" cy="65" r="5" fill="#bcafff"/>
      <circle cx="982" cy="337" r="3" fill="#b2f5d7"/>
    </g>
    <rect x="906" y="125" width="152" height="152" rx="27" transform="rotate(-12 982 201)" fill="#162537" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="921" y="140" width="122" height="122" rx="18" fill="#0f1928" stroke="#344658"/>
    <g stroke="#b2f5d7" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M925 126V116M953 122V110M1010 118V107M1038 128V117M905 162H895M900 190H888M903 230H891M1061 174H1073M1064 202H1076M1062 238H1074M935 278V289M970 282V294M1008 276V288" opacity=".65"/>
      <path d="M956 184L939 201L956 218M1008 184L1025 201L1008 218M992 178L974 224" stroke-width="5"/>
    </g>
    <rect x="1013" y="231" width="11" height="3" rx="1" fill="#bcafff" class="cursor"/>
    <path class="star" d="M1115 42L1120 56L1134 61L1120 66L1115 80L1110 66L1096 61L1110 56Z" fill="#bcafff"/>
    <text x="915" y="368" font-size="13" fill="#8195b2" class="mono" letter-spacing="1.5">BUILD. LEARN. REPEAT.</text>
  </g>
</svg>
